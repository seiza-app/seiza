name: Sync server

# Only runs when the sync server (apps/sync-server) or this file changes.
on:
  push:
    branches: [main]
    paths:
      - apps/sync-server/**
      - .github/workflows/sync-server.yml
    # A tag like sync-server-v0.1.0 also publishes the image as 0.1.0. (Tags run whatever changed.)
    tags: ['sync-server-v*']
  pull_request:
    paths:
      - apps/sync-server/**
      - .github/workflows/sync-server.yml

permissions:
  contents: read

# Actions are pinned to a commit, as in ci.yml.

# On a pull request, a newer push cancels the run it replaces, to save Actions minutes. Runs on
# main and tags always finish, so a half-published image never happens.
concurrency:
  group: sync-server-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Debug info makes the build slower and the cache bigger, and CI never needs it.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CARGO_INCREMENTAL: 0

jobs:
  server:
    runs-on: ubuntu-latest
    # A couple of minutes with the cache. GitHub's default limit is 6 hours, which a hung step
    # would use up.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/sync-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          components: rustfmt, clippy

      # Only main saves the cache; pull requests start from main's.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: apps/sync-server
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Known security problems, licenses that fit AGPL-3.0, and crates only from crates.io. The
  # rules are in apps/sync-server/deny.toml.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: apps/sync-server/Cargo.toml

  # The Docker image builds, starts and answers its health check. Nothing is pushed from here; the
  # publish jobs below do that.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/sync-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t seiza-sync .
      - run: |
          docker run -d --name seiza-sync -p 8080:8080 seiza-sync
          for attempt in $(seq 1 20); do
            if curl -fs localhost:8080/health; then break; fi
            [ "$attempt" = 20 ] && { docker logs seiza-sync; exit 1; }
            sleep 1
          done
          curl -fs -H 'Seiza-Protocol: 1' -H 'Content-Type: application/json' \
            -d '{"label":"Y2k="}' localhost:8080/v1/groups > /dev/null
          docker exec seiza-sync seiza-sync stats
          docker exec seiza-sync seiza-sync health

  # After everything above passes on main (or a tag), the image goes to GitHub's registry as
  # ghcr.io/seiza-app/seiza-sync, so updating a server is `docker compose pull && docker compose
  # up -d`. Each architecture builds on its own kind of runner, since building Rust under
  # emulation takes far longer. Only the GITHUB_TOKEN that GitHub gives each run is used.
  publish:
    if: github.event_name == 'push'
    needs: [server, deny, docker]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: apps/sync-server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by digest only; the manifest job below gives both architectures their tags.
      - run: |
          docker buildx create --use
          docker buildx build . --platform '${{ matrix.platform }}' \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --output type=image,name=ghcr.io/seiza-app/seiza-sync,push-by-digest=true,name-canonical=true,push=true \
            --metadata-file metadata.json
          jq -r '."containerimage.digest"' metadata.json > "$RUNNER_TEMP/digest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digest
          retention-days: 1

  # Puts both architectures under one name: latest and sha-<commit> for main, and the version
  # (e.g. 0.1.0) for a sync-server-v tag.
  manifest:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-*
          path: digests
      - run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          image=ghcr.io/seiza-app/seiza-sync
          if [[ "$GITHUB_REF" == refs/tags/sync-server-v* ]]; then
            tags=(-t "$image:${GITHUB_REF#refs/tags/sync-server-v}")
          else
            tags=(-t "$image:latest" -t "$image:sha-${GITHUB_SHA::7}")
          fi
          sources=()
          for file in digests/*/digest; do sources+=("$image@$(cat "$file")"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "${tags[1]}"
