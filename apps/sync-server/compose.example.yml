# Copy to compose.yml, change what you need, then: docker compose up -d
# To update later: docker compose pull && docker compose up -d
services:
  seiza-sync:
    # latest is the newest build of main. For a fixed version use e.g. :0.1.0, or :sha-<commit>
    # to go back to an earlier build.
    image: ghcr.io/seiza-app/seiza-sync:latest
    # Or build it from this folder instead (then docker compose up -d --build):
    # build: .
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - seiza-sync-data:/data
    environment:
      # Who can start a sync group here: first-group-only (your first device starts yours, then
      # the server is closed to new ones), invites, or open.
      SEIZA_SYNC_NEW_GROUPS: first-group-only
      # The most each group can store, in megabytes.
      SEIZA_SYNC_GROUP_MAX_MB: 50
      # Behind a Cloudflare Tunnel, rate limits should go by the visitor's address, not the
      # tunnel's.
      # SEIZA_SYNC_CLIENT_IP_HEADER: CF-Connecting-IP

volumes:
  seiza-sync-data:
