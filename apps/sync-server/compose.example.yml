# Copy to compose.yml, change what you need, then: docker compose up -d --build
services:
  seiza-sync:
    build: .
    restart: unless-stopped
    ports:
      - '8080:8080'
    volumes:
      - seiza-sync-data:/data
    environment:
      # Who can start a sync group here: first-group-only (your first device starts yours, then
      # the server is closed to new ones), invites, or open.
      SEIZA_SYNC_NEW_GROUPS: first-group-only
      # The most each group can store, in megabytes.
      SEIZA_SYNC_GROUP_MAX_MB: 50
      # Behind a Cloudflare Tunnel, rate limits should go by the visitor's address, not the
      # tunnel's.
      # SEIZA_SYNC_CLIENT_IP_HEADER: CF-Connecting-IP

volumes:
  seiza-sync-data:
